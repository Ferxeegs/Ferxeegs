<svg width="1280" height="240" viewBox="0 0 1280 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Featured work: Aroomi</title>
  <desc id="desc">University-wide room and asset booking platform for Universitas Diponegoro.</desc>
