    <g transform="translate(25, 114)">
      <circle cx="5" cy="6" r="5" fill="#41B883"/>
      <text x="16" y="10" class="lang-name">Vue 12.02%</text>
    </g>
    <g transform="translate(247, 114)">
      <circle cx="5" cy="6" r="5" fill="#00ADD8"/>
      <text x="16" y="10" class="lang-name">Go 1.83%</text>
    </g>
    <g transform="translate(25, 142)">
      <circle cx="5" cy="6" r="5" fill="#555555"/>
      <text x="16" y="10" class="lang-name">C 1.54%</text>
    </g>
    <g transform="translate(247, 142)">
      <circle cx="5" cy="6" r="5" fill="#663399"/>
      <text x="16" y="10" class="lang-name">CSS 1.29%</text>
    </g>
</svg>
