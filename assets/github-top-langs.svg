<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title desc">
  <title id="title">Most Used Languages</title>
  <desc id="desc">Compact GitHub top languages card for Ferxeegs</desc>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #E6F7FF; }
    .lang-name { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #94A3B8; }
  </style>
  <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#000000" fill-opacity="0" stroke="#000000" stroke-opacity="0"/>
  <text x="25" y="38" class="header">Most Used Languages</text>
  <defs>
    <mask id="lang-bar-mask">
      <rect x="25" y="58" width="445" height="8" rx="5" fill="white"/>
    </mask>
  </defs>
      <rect height="8" x="25.00" y="58" width="265.07" fill="#3572A5" mask="url(#lang-bar-mask)"/>
      <rect height="8" x="290.07" y="58" width="105.70" fill="#3178C6" mask="url(#lang-bar-mask)"/>
      <rect height="8" x="395.77" y="58" width="53.48" fill="#41B883" mask="url(#lang-bar-mask)"/>
      <rect height="8" x="449.25" y="58" width="8.16" fill="#00ADD8" mask="url(#lang-bar-mask)"/>
      <rect height="8" x="457.41" y="58" width="6.85" fill="#555555" mask="url(#lang-bar-mask)"/>
      <rect height="8" x="464.26" y="58" width="5.74" fill="#663399" mask="url(#lang-bar-mask)"/>
    <g transform="translate(25, 86)">
      <circle cx="5" cy="6" r="5" fill="#3572A5"/>
      <text x="16" y="10" class="lang-name">Python 59.57%</text>
    </g>
    <g transform="translate(247, 86)">
      <circle cx="5" cy="6" r="5" fill="#3178C6"/>
      <text x="16" y="10" class="lang-name">TypeScript 23.75%</text>
