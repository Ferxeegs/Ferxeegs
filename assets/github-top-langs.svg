<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title desc">
  <title id="title">Most Used Languages</title>
  <desc id="desc">Compact GitHub top languages card for Ferxeegs</desc>
  <style>
    .kicker { font: 600 10px 'Segoe UI', Ubuntu, sans-serif; fill: #67E8F9; letter-spacing: 1.6px; }
    .header { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #E6F7FF; }
    .lang-name { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #94A3B8; }
  </style>
  <rect x="0.5" y="0.5" width="494" height="194" rx="16" fill="#07111F" fill-opacity="0.55" stroke="#67E8F9" stroke-opacity="0.16"/>
  <text x="25" y="28" class="kicker">GITHUB</text>
  <text x="25" y="52" class="header">Most Used Languages</text>
  <rect x="25" y="62" width="36" height="3" rx="1.5" fill="#22D3EE"/>
  <defs>
    <mask id="lang-bar-mask">
      <rect x="25" y="80" width="445" height="8" rx="5" fill="white"/>
    </mask>
  </defs>
  <rect height="8" x="25.00" y="80" width="262.85" fill="#3572A5" mask="url(#lang-bar-mask)"/>
  <rect height="8" x="287.85" y="80" width="108.47" fill="#3178C6" mask="url(#lang-bar-mask)"/>
  <rect height="8" x="396.32" y="80" width="53.03" fill="#41B883" mask="url(#lang-bar-mask)"/>
  <rect height="8" x="449.35" y="80" width="8.09" fill="#00ADD8" mask="url(#lang-bar-mask)"/>
  <rect height="8" x="457.45" y="80" width="6.79" fill="#555555" mask="url(#lang-bar-mask)"/>
  <rect height="8" x="464.24" y="80" width="5.76" fill="#663399" mask="url(#lang-bar-mask)"/>
  <g transform="translate(25, 108)">
    <circle cx="5" cy="6" r="5" fill="#3572A5"/>
    <text x="16" y="10" class="lang-name">Python 59.07%</text>
  </g>
  <g transform="translate(247, 108)">
    <circle cx="5" cy="6" r="5" fill="#3178C6"/>
    <text x="16" y="10" class="lang-name">TypeScript 24.38%</text>
  </g>
  <g transform="translate(25, 136)">
    <circle cx="5" cy="6" r="5" fill="#41B883"/>
    <text x="16" y="10" class="lang-name">Vue 11.92%</text>
  </g>
  <g transform="translate(247, 136)">
    <circle cx="5" cy="6" r="5" fill="#00ADD8"/>
    <text x="16" y="10" class="lang-name">Go 1.82%</text>
  </g>
  <g transform="translate(25, 164)">
    <circle cx="5" cy="6" r="5" fill="#555555"/>
    <text x="16" y="10" class="lang-name">C 1.53%</text>
  </g>
  <g transform="translate(247, 164)">
    <circle cx="5" cy="6" r="5" fill="#663399"/>
    <text x="16" y="10" class="lang-name">CSS 1.30%</text>
  </g>
</svg>
