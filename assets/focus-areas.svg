<svg width="1280" height="220" viewBox="0 0 1280 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Focus areas</title>
  <desc id="desc">Web platforms, information systems, AI integration, and infrastructure.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0B1B2E"/>
      <stop offset="1" stop-color="#08222C"/>
    </linearGradient>
  </defs>

  <g>
    <rect width="301" height="220" rx="24" fill="url(#card)" stroke="#67E8F9" stroke-opacity="0.14"/>
    <rect x="24" y="28" width="44" height="44" rx="12" fill="#102536"/>
    <rect x="35" y="39" width="22" height="16" rx="3" fill="none" stroke="#7DD3FC" stroke-width="1.8"/>
    <path d="M39 43H53" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round"/>
    <text x="24" y="102" fill="#F8FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Web Platforms</text>
    <text fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">
      <tspan x="24" y="132">Aplikasi web yang rapi, cepat,</tspan>
      <tspan x="24" y="152">dan siap dipakai operasional.</tspan>
    </text>
  </g>

  <g transform="translate(326 0)">
    <rect width="301" height="220" rx="24" fill="url(#card)" stroke="#67E8F9" stroke-opacity="0.14"/>
    <rect x="24" y="28" width="44" height="44" rx="12" fill="#102536"/>
    <rect x="36" y="40" width="20" height="6" rx="1.5" fill="none" stroke="#5EEAD4" stroke-width="1.8"/>
    <rect x="36" y="50" width="20" height="6" rx="1.5" fill="none" stroke="#5EEAD4" stroke-width="1.8"/>
    <rect x="36" y="60" width="20" height="6" rx="1.5" fill="none" stroke="#5EEAD4" stroke-width="1.8"/>
    <text x="24" y="102" fill="#F8FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Internal Systems</text>
    <text fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">
      <tspan x="24" y="132">Sistem manajemen aset, layanan,</tspan>
      <tspan x="24" y="152">dan alur kerja institusi.</tspan>
    </text>
  </g>

  <g transform="translate(652 0)">
    <rect width="301" height="220" rx="24" fill="url(#card)" stroke="#67E8F9" stroke-opacity="0.14"/>
    <rect x="24" y="28" width="44" height="44" rx="12" fill="#102536"/>
    <circle cx="46" cy="50" r="9" fill="none" stroke="#A78BFA" stroke-width="1.8"/>
    <circle cx="46" cy="50" r="2.4" fill="#A78BFA"/>
    <path d="M46 41V38M46 62V59M37 50H34M58 50H55" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round"/>
    <text x="24" y="102" fill="#F8FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">AI Integration</text>
    <text fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">
      <tspan x="24" y="132">Integrasi AI yang masuk ke alur</tspan>
      <tspan x="24" y="152">kerja nyata, bukan sekadar demo.</tspan>
    </text>
  </g>

  <g transform="translate(978 0)">
    <rect width="302" height="220" rx="24" fill="url(#card)" stroke="#67E8F9" stroke-opacity="0.14"/>
    <rect x="24" y="28" width="44" height="44" rx="12" fill="#102536"/>
    <rect x="35" y="40" width="22" height="8" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
    <rect x="35" y="52" width="22" height="8" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="24" y="102" fill="#F8FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Infrastructure</text>
    <text fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">
      <tspan x="24" y="132">Arsitektur server, Docker,</tspan>
      <tspan x="24" y="152">dan operasional end-to-end.</tspan>
